[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "niharness"
version = "0.1.0"
description = "Air-gapped, event-sourced multi-agent coding harness driven by local models"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mateusz Okulanis", email = "FPGArtktic@outlook.com" }]
keywords = ["agents", "llm", "air-gapped", "codegen", "harness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "typer>=0.12",
  "httpx>=0.27",
  "structlog>=24.4",
  "platformdirs>=4.3",
]

[project.optional-dependencies]
vector = ["qdrant-client>=1.12"]
tools = ["mcp>=1.2"]
metrics = ["psutil>=6.0", "nvidia-ml-py>=12.560"]
tracing = ["opentelemetry-sdk>=1.27"]
chunking = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.3"]

[project.scripts]
nih = "niharness.cli.main:main"

[project.urls]
Homepage = "https://github.com/FPGArtktic/NIHarness"
Documentation = "https://niharness.readthedocs.io"
Source = "https://github.com/FPGArtktic/NIHarness"

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "respx>=0.21",
  "import-linter>=2.1",
  "reuse>=4.0",
  "pip-licenses>=5.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "mkdocs-git-revision-date-localized-plugin>=1.2",
  "mike>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/niharness"]

[tool.hatch.build.targets.wheel.force-include]
"src/niharness/prompts" = "niharness/prompts"

# ---------------------------------------------------------------- lint / format

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",    # builtin shadowing
  "ANN",  # missing annotations
  "ARG",  # unused arguments
  "B",    # bugbear
  "C4",   # comprehensions
  "C90",  # cyclomatic complexity
  "D",    # docstrings
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import order
  "N",    # naming
  "PT",   # pytest style
  "PTH",  # pathlib over os.path
  "RET",  # return simplification
  "RUF",  # ruff specials
  "S",    # bandit security checks
  "SIM",  # simplify
  "T20",  # no print()
  "TID",  # tidy imports
  "UP",   # pyupgrade
  "W",    # warnings
]
ignore = [
  "D105",  # magic method docstring
  "D107",  # __init__ docstring (models document themselves)
  "D203",  # conflicts with D211
  "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D100", "D101", "D102", "D103", "D104", "ARG", "S101", "S603", "S607"]
"docs/**" = ["D"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ------------------------------------------------------------------- type check

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_explicit = false
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ------------------------------------------------------------------------ tests

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
asyncio_mode = "auto"
markers = [
  "integration: requires Podman and a local inference backend (skipped by default)",
  "golden: prompt snapshot test (fixed model, fixed seed)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/niharness"]
branch = true

# ------------------------------------------------------- architecture boundaries

[tool.importlinter]
root_packages = ["niharness"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure: it imports no adapter, no CLI, no I/O library"
type = "forbidden"
source_modules = ["niharness.domain"]
forbidden_modules = [
  "niharness.adapters",
  "niharness.cli",
  "niharness.config",
  "httpx",
  "qdrant_client",
  "structlog",
  "typer",
  "subprocess",
  "socket",
  "sqlite3",
  "urllib",
]

[[tool.importlinter.contracts]]
name = "Ports depend on the domain only"
type = "forbidden"
source_modules = ["niharness.ports"]
forbidden_modules = ["niharness.adapters", "niharness.cli", "httpx", "qdrant_client"]

[[tool.importlinter.contracts]]
name = "Layered: cli over adapters over ports over domain"
type = "layers"
layers = [
  "niharness.cli",
  "niharness.adapters",
  "niharness.ports",
  "niharness.domain",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Adapters do not import each other"
type = "independence"
modules = [
  "niharness.adapters.jsonl_events",
  "niharness.adapters.openai_compat",
  "niharness.adapters.git",
  "niharness.adapters.podman",
]
