#
# `cargo deny check licenses` runs in the full gate. The allowlist mirrors
# licenses.toml at the repository root: everything must be GPL-3.0-or-later
# compatible.

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "GPL-3.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
